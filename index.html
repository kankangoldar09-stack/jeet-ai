<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ZoZo AI - Neural Companion</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
        window.process = window.process || { env: { API_KEY: "" } };
    </script>
    <style>
        :root { 
            --accent: #8ab4f8; 
            --bg-dark: #131314;
            --bg-sidebar: #1e1f20;
            --bg-input: #282a2d;
            --text-primary: #e3e3e3;
            --text-secondary: #c4c7c5;
        }
        body {
            background: var(--bg-dark);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100dvh;
            width: 100vw;
            position: fixed;
            -webkit-font-smoothing: antialiased;
        }
        #root { height: 100%; width: 100%; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .sidebar-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            color: var(--text-secondary);
            text-align: left;
        }
        .sidebar-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: white;
        }
        .sidebar-btn.active {
            background: rgba(138, 180, 248, 0.1);
            color: var(--accent);
        }
        
        .chat-input-container {
            background: var(--bg-input);
            border-radius: 28px;
            padding: 4px 8px;
            transition: box-shadow 0.2s ease;
        }
        .chat-input-container:focus-within {
            box-shadow: 0 0 0 2px rgba(138, 180, 248, 0.2);
        }
        
        .user-msg {
            background: #2b2c2f;
            border-radius: 18px;
            padding: 12px 16px;
            max-width: 85%;
            align-self: flex-end;
        }
        .model-msg {
            max-width: 90%;
            align-self: flex-start;
            line-height: 1.6;
        }
        
        .tech-title {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease forwards;
        }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.35.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
